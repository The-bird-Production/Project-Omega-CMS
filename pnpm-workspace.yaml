packages:
  - "apps/*"
  - "packages/*"
# These packages run install/postinstall scripts we need (Prisma client
# generation, sharp's native binary, path resolution helpers) — all
# well-known, required for the app to function.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true
