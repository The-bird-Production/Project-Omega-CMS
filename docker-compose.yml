services:
  omega-client:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
    container_name: omega_client
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
    depends_on:
      - omega-server
    volumes:
      - ./apps/api/Themes:/app/apps/web/app/Themes
      - ./apps/api/Plugins:/app/apps/web/app/Plugins
      - ./apps/web/public:/app/apps/web/public
      - ./apps/api/Themes_style:/app/apps/web/public/themes

  omega-server:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: omega_server
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=mysql://user:password@omega-db:3306/omega
      - NODE_ENV=production
      - BETTER_AUTH_SECRET="your_secret_key_here"
      - APP_PORT=4000
      - ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - ./apps/api/Public:/app/apps/api/Public
      - ./apps/api/Themes:/app/apps/api/Themes
      - ./apps/api/Plugins:/app/apps/api/Plugins
      - ./apps/api/config:/app/apps/api/config
      - ./apps/api/Themes_style:/app/apps/api/Themes_style
    depends_on:
      - omega-db
    command: >
      sh -c "echo 'Waiting for MySQL...' &&
             until nc -z omega-db 3306; do sleep 1; done &&
             echo 'MySQL ready, applying migrations...' &&
             pnpm --filter @omega/db run migrate:deploy &&
             pnpm --filter @omega/db run generate &&
             npx tsx server.js"

  omega-db:
    image: mysql:8.0
    container_name: omega_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: omega
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: omega_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: omega-db
      PMA_USER: user
      PMA_PASSWORD: password
      PMA_ABSOLUTE_URI: http://localhost:8080/
    depends_on:
      - omega-db

volumes:
  db_data:
