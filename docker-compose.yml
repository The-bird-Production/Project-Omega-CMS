# Official self-hosting compose file: pulls prebuilt images from GHCR
# (published by .github/workflows/release.yml on every green push to main)
# instead of building from source. For local development/contributing, use:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Copy .env.example to .env and fill it in before running this.
services:
  omega-client:
    image: ghcr.io/the-bird-production/omega-web:stable
    container_name: omega_client
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000}
    depends_on:
      - omega-server
    volumes:
      - ./apps/api/Themes:/repo/apps/web/app/Themes
      - ./apps/api/Plugins:/repo/apps/web/app/Plugins
      - ./apps/web/public:/repo/apps/web/public
      - ./apps/api/Themes_style:/repo/apps/web/public/themes
    labels:
      - com.centurylinklabs.watchtower.enable=true

  omega-server:
    image: ghcr.io/the-bird-production/omega-api:stable
    container_name: omega_server
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=mysql://user:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your .env file}@omega-db:3306/omega
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in your .env file}
      - APP_PORT=4000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./apps/api/Public:/repo/apps/api/Public
      - ./apps/api/Themes:/repo/apps/api/Themes
      - ./apps/api/Plugins:/repo/apps/api/Plugins
      - ./apps/api/config:/repo/apps/api/config
      - ./apps/api/Themes_style:/repo/apps/api/Themes_style
    depends_on:
      - omega-db
    command: >
      sh -c "echo 'Waiting for MySQL...' &&
             until nc -z omega-db 3306; do sleep 1; done &&
             echo 'MySQL ready, applying migrations...' &&
             pnpm --filter @omega/db run migrate:deploy &&
             pnpm --filter @omega/db run generate &&
             npx tsx server.js"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  omega-db:
    image: mysql:8.0
    container_name: omega_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your .env file}
      MYSQL_DATABASE: omega
      MYSQL_USER: user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your .env file}
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    # No port published by default — MySQL only needs to be reachable from
    # the other containers on this Docker network. Use docker-compose.dev.yml
    # if you need to connect to it directly (e.g. from a local DB client).

  # Watches the omega-client/omega-server images (scoped via the
  # com.centurylinklabs.watchtower.enable label above) and recreates them
  # when a new digest is pushed to the :stable tag on GHCR — this is what
  # delivers updates to self-hosted instances without anyone accessing the
  # host. Opt-in: only starts with `docker compose --profile watchtower up`.
  watchtower:
    image: containrrr/watchtower
    container_name: omega_watchtower
    restart: always
    profiles: ["watchtower"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
    command: --label-enable

volumes:
  db_data:
