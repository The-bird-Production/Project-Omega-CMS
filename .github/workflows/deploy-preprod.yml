name: Deploy to Preprod

on:
  push:
    branches:
      - preprod # branche de préproduction

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: bash -l {0} # ← charge l'environnement complet (comme un vrai terminal)

    steps:
      - name: Clean up old files
        run: |
          rm -rf apps packages
          mkdir -p apps packages

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install workspace dependencies
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 22
          corepack enable
          pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 22
          pnpm --filter @omega/db run generate

      - name: Build frontend
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 22
          pnpm --filter @omega/web run build

      - name: Restart services
        run: sudo /usr/local/bin/restart-omega.sh
