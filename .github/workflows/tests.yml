name: CI - Tests Backend & Frontend

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend-tests:
    name: ⚙️ Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: omega_cms_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 📦 Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔄 Setup test database
        working-directory: apps/api
        run: |
          pnpm run test:setup
          pnpm run setup:test

      - name: 🧪 Run backend tests
        working-directory: apps/api
        run: pnpm run test

  frontend-checks:
    name: 🖥️ Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 📦 Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: "🔍 Lint (non-blocking - pre-existing findings not yet triaged)"
        continue-on-error: true
        working-directory: apps/web
        run: pnpm run lint

      - name: 🏗 Build
        working-directory: apps/web
        run: pnpm run build
