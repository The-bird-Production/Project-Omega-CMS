name: CI - Tests Backend & Frontend

on:
  push:
    branches:
      - main
      - dev
  # No branch filter here: this repo stacks feature PRs on top of each other
  # (base branch isn't always main/dev), and every PR should still get CI
  # regardless of what it targets.
  pull_request: {}

# None of these jobs push, release, or comment — read-only is sufficient
# and is what CodeQL flags as missing otherwise.
permissions:
  contents: read

jobs:
  backend-tests:
    name: ⚙️ Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: omega_cms_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 📦 Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔎 Typecheck
        working-directory: apps/api
        run: pnpm run typecheck

      - name: 📝 Prepare test env file
        working-directory: apps/api
        run: cp .env.test.example .env.test

      - name: 🔄 Setup test database
        working-directory: apps/api
        run: pnpm run test:setup

      - name: 🧪 Run backend tests
        working-directory: apps/api
        run: pnpm run test

      # Every schema change before the baseline migration was applied with
      # `prisma db push` (no tracked migrations existed) — this proves the
      # migrate:deploy:safe wrapper actually auto-resolves the resulting
      # P3005 ("database schema is not empty") against a real, freshly
      # `db push`-ed MySQL database, since that's exactly the state every
      # pre-existing self-hosted instance's database is in.
      - name: 🧪 Verify migrate:deploy:safe auto-baselines a pre-existing (db push) database
        working-directory: packages/db
        env:
          DATABASE_URL: mysql://root:password@127.0.0.1:3307/omega_baseline_test
        run: |
          mysql -h127.0.0.1 -P3307 -uroot -ppassword -e "CREATE DATABASE omega_baseline_test"
          pnpm run db:push
          pnpm run migrate:deploy:safe

  frontend-checks:
    name: 🖥️ Frontend Build & Lint
    runs-on: ubuntu-latest
    env:
      # Without this, better-auth's client throws "Invalid base URL: undefined/api/auth/"
      # during prerendering and the build fails on every admin/auth page.
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
      # Exercises the metadataBase/sitemap/robots code paths during the build
      # (see apps/web/app/layout.js, sitemap.js, robots.js).
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 📦 Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: "🔍 Lint"
        working-directory: apps/web
        run: pnpm run lint

      - name: 🏗 Build
        working-directory: apps/web
        run: pnpm run build

  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🏗 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build-only (no push): catches a broken Dockerfile before it ever
      # reaches the release pipeline. Deliberately does NOT override
      # NEXT_PUBLIC_BACKEND_URL for the web image — the release pipeline
      # doesn't either, so this exercises the exact same build-time default
      # (the http://backend.invalid placeholder) that broke production once
      # already when it wasn't a syntactically valid URL.
      - name: 🐳 Build ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: false
          build-args: |
            APP_VERSION=ci-build
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
